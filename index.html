<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal — Robinhood Chain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #171E29;
  --surface: #1E2733;
  --surface-hi: #243040;
  --line: #2C3745;
  --text: #E4E8ED;
  --dim: #8695A8;
  --faint: #5C6B7E;
  --moss: #6FAF8D;
  --ochre: #D2A24C;
  --rust: #C46B5A;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Instrument Sans', system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}

.wrap { max-width: 1080px; margin: 0 auto; padding: 40px 28px 80px; }

header { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; margin-bottom: 36px; }
h1 { font-size: 19px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.chain { color: var(--faint); font-size: 13px; margin-top: 3px; }
.pulse { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 12px; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--moss); }
.dot.stale { background: var(--faint); }

.lead {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 26px 28px; margin-bottom: 32px; display: grid;
  grid-template-columns: 1fr auto; gap: 28px; align-items: center;
}
.lead-label { color: var(--faint); font-size: 12px; margin-bottom: 10px; }
.lead-sym { font-size: 34px; font-weight: 600; letter-spacing: -0.02em; line-height: 1; }
.lead-name { color: var(--dim); font-size: 14px; margin-top: 6px; }
.lead-meta { color: var(--faint); font-size: 12px; margin-top: 14px; }
.lead-score { text-align: right; }
.lead-num { font-size: 52px; font-weight: 600; line-height: 1; letter-spacing: -0.03em; }
.lead-of { color: var(--faint); font-size: 13px; margin-top: 4px; }

.comp { display: flex; gap: 2px; height: 6px; border-radius: 3px; overflow: hidden; background: #131922; }
.comp span { display: block; height: 100%; }
.comp.lg { height: 9px; border-radius: 4px; margin-top: 16px; }

.head {
  display: grid; grid-template-columns: 62px minmax(0,1fr) 220px 84px 96px;
  gap: 16px; padding: 0 16px 10px; color: var(--faint); font-size: 12px;
}
.head button {
  background: none; border: 0; color: inherit; font: inherit; padding: 0;
  cursor: pointer; text-align: left;
}
.head button:hover { color: var(--text); }
.head .r { text-align: right; }

.row > * { min-width: 0; }
.row {
  display: grid; grid-template-columns: 62px minmax(0,1fr) 220px 84px 96px;
  gap: 16px; align-items: center; padding: 15px 16px;
  border-top: 1px solid var(--line); cursor: pointer;
}
.row:hover { background: var(--surface); }
.score { font-size: 21px; font-weight: 600; letter-spacing: -0.02em; }
.sym { font-weight: 500; font-size: 15px; }
.addr { font-family: ui-monospace, 'SF Mono', monospace; color: var(--faint); font-size: 11px; white-space: nowrap; }
.sym { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.age { color: var(--dim); font-size: 13px; text-align: right; }
.flag { font-size: 12px; text-align: right; }

.detail { padding: 4px 16px 22px; background: var(--surface); }
.sigs { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1px; background: var(--line); border-radius: 10px; overflow: hidden; }
.sig { background: var(--surface-hi); padding: 14px 16px; }
.sig-top { display: flex; justify-content: space-between; align-items: baseline; }
.sig-name { color: var(--dim); font-size: 12px; }
.sig-val { font-size: 17px; font-weight: 600; }
.sig-why { color: var(--faint); font-size: 12px; margin-top: 6px; line-height: 1.45; }
.links { margin-top: 16px; display: flex; gap: 18px; font-size: 13px; flex-wrap: wrap; }
.links a { color: var(--dim); text-decoration: none; border-bottom: 1px solid var(--line); padding-bottom: 2px; }
.links a:hover { color: var(--text); border-color: var(--dim); }

.empty { text-align: center; padding: 70px 20px; color: var(--dim); }
.empty strong { display: block; color: var(--text); font-size: 17px; font-weight: 500; margin-bottom: 8px; }
.empty code { background: var(--surface); padding: 3px 7px; border-radius: 5px; font-size: 12px; color: var(--dim); }

:focus-visible { outline: 2px solid var(--moss); outline-offset: 2px; }
@media (prefers-reduced-motion: no-preference) { .detail { animation: open .16s ease-out; } }
@keyframes open { from { opacity: 0; transform: translateY(-3px); } }
@media (max-width: 720px) {
  .wrap { padding: 26px 16px 60px; }
  .head { display: none; }
  .row {
    grid-template-columns: 46px minmax(0,1fr) auto;
    grid-template-areas: "score token flag" ". bar bar";
    gap: 6px 12px; padding: 13px 4px;
  }
  .row .c-score { grid-area: score; }
  .row .c-token { grid-area: token; }
  .row .c-flag  { grid-area: flag; }
  .row .c-comp  { grid-area: bar; }
  .row .c-age   { display: none; }
  .score { font-size: 19px; }
  .lead { grid-template-columns: 1fr; gap: 14px; padding: 20px; }
  .lead-score { display: flex; align-items: baseline; gap: 8px; }
  .lead-num { font-size: 40px; }
  .lead-of { margin-top: 0; }
  .detail { padding: 4px 4px 18px; }
  .sigs { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 400px) { .sigs { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Signal</h1>
      <div class="chain">New pairs on Robinhood Chain</div>
    </div>
    <div class="pulse"><span class="dot" id="dot"></span><span id="pulse-txt">watching</span></div>
  </header>

  <div id="lead"></div>
  <div id="board"></div>
</div>

<script>
const EXPLORER = "https://robinhoodchain.blockscout.com/token/";
const SIGNALS = [
  { key: "lpLock",              label: "Liquidity", color: "#6FAF8D" },
  { key: "contractRisk",        label: "Contract",  color: "#7FA8C9" },
  { key: "bundle",              label: "Bundle",    color: "#C98F7A" },
  { key: "holderConcentration", label: "Holders",   color: "#B79BC4" },
  { key: "deployerHistory",     label: "Deployer",  color: "#8FA5B8" },
  { key: "volumeMomentum",      label: "Momentum",  color: "#D2A24C" }
];
const WEIGHTS = { lpLock:.22, contractRisk:.22, bundle:.18, holderConcentration:.15, deployerHistory:.13, volumeMomentum:.10 };

let data = [], sortKey = "score", sortDir = -1, openRow = null;

const tone = s => s >= 70 ? "#6FAF8D" : s >= 40 ? "#D2A24C" : "#C46B5A";
const short = a => a.slice(0, 6) + "\u2026" + a.slice(-4);

function age(ms) {
  if (!ms) return "\u2014";
  const m = Math.round((Date.now() - ms) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return m + "m";
  const h = Math.round(m / 60);
  return h < 24 ? h + "h" : Math.round(h / 24) + "d";
}

function comp(t, big) {
  const segs = SIGNALS.map(s => {
    const v = t.scores && t.scores[s.key] ? t.scores[s.key].score : 0;
    return '<span style="width:' + (v * WEIGHTS[s.key]) + '%;background:' + s.color + '"></span>';
  }).join("");
  return '<div class="comp' + (big ? " lg" : "") + '">' + segs + '</div>';
}

function venueBadge(t) {
  if (!t.venue) return "";
  var v3 = t.dexVersion === "v3";
  var extra = (t.alsoOn && t.alsoOn.length) ? " +" + t.alsoOn.length : "";
  return '<span style="margin-left:7px;font-size:10px;font-weight:400;padding:2px 6px;border-radius:4px;'
    + 'background:' + (v3 ? "#252F3D" : "#1F2A22") + ';color:' + (v3 ? "#8FA5B8" : "#6FAF8D") + ';'
    + 'vertical-align:1px;">' + t.venue + extra + '</span>';
}

function flagOf(t) {
  const red = c => '<span style="color:#C46B5A">' + c + '</span>';
  const amb = c => '<span style="color:#D2A24C">' + c + '</span>';
  if (t.vetoed) return red("honeypot");
  if (t.proxy && t.proxy.upgradeable) return red("upgradeable");
  if (t.bundle && t.bundle.bundlePct > 30) return red("bundled");
  if (t.scores && t.scores.lpLock && t.scores.lpLock.score === 0) return red("LP open");
  if (t.sellability && t.sellability.sellable === null) return amb("sell unknown");
  if (t.scores && t.scores.deployerHistory && t.scores.deployerHistory.score <= 20) return red("serial");
  if (t.scores && t.scores.lpLock && t.scores.lpLock.score === 100) return '<span style="color:#6FAF8D">LP burned</span>';
  return '<span style="color:var(--faint)">\u2014</span>';
}

function chips(t) {
  const out = [];
  const chip = (txt, col) => '<span style="display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;background:#131922;color:' + col + ';border:1px solid ' + col + '33;">' + txt + '</span>';

  if (t.sellability) {
    if (t.sellability.sellable === true) out.push(chip("sell simulated ok", "#6FAF8D"));
    else if (t.sellability.sellable === false) out.push(chip("SELL REVERTED", "#C46B5A"));
    else out.push(chip("sellability unknown", "#D2A24C"));
  }
  if (t.proxy && t.proxy.kind && t.proxy.kind !== "plain" && t.proxy.kind !== "eoa")
    out.push(chip(t.proxy.kind, t.proxy.upgradeable ? "#C46B5A" : "#8695A8"));
  if (t.venue) out.push(chip("pool: " + t.venue, t.dexVersion === "v3" ? "#8FA5B8" : "#6FAF8D"));
  if (t.alsoOn && t.alsoOn.length) out.push(chip("also on " + t.alsoOn.join(", "), "#8695A8"));
  if (t.bytecode && t.bytecode.verified) out.push(chip("source verified", "#6FAF8D"));
  else out.push(chip("unverified", "#D2A24C"));
  if (t.launchpad && t.launchpad.viaLaunchpad) out.push(chip("via " + t.launchpad.origin, "#6FAF8D"));
  else if (t.launchpad && t.launchpad.origin === "direct") out.push(chip("direct deploy", "#8695A8"));
  if (t.bundle && t.bundle.bundlePct !== null)
    out.push(chip(t.bundle.bundlePct.toFixed(1) + "% bundled", t.bundle.bundlePct > 30 ? "#C46B5A" : "#8695A8"));
  (t.bytecode && t.bytecode.found ? t.bytecode.found : []).forEach(f => out.push(chip(f.tag, "#D2A24C")));
  if (t.social && t.social.configured && t.social.count !== null) {
    out.push(chip(t.social.count + " posts/24h" + (t.social.suspicious ? " \u26a0" : ""), t.social.suspicious ? "#D2A24C" : "#8695A8"));
  } else {
    out.push('<span title="Social monitoring requires a paid X API key" style="display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;background:#1A212B;color:#4A5666;border:1px dashed #333E4C;cursor:default;">social \u2014 contact administrator</span>');
  }
  return '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;">' + out.join("") + '</div>';
}

function renderLead() {
  const el = document.getElementById("lead");
  const t = [...data].sort((a, b) => b.score - a.score)[0];
  if (!t) { el.innerHTML = ""; return; }
  const holders = t.scores && t.scores.holderConcentration ? t.scores.holderConcentration.detail : "";
  el.innerHTML =
    '<div>' +
      '<div class="lead-label">Strongest signal right now</div>' +
      '<div class="lead-sym">' + t.symbol + '</div>' +
      '<div class="lead-name">' + t.name + '</div>' +
      '<div class="lead-meta">' + age(t.launchedAt) + ' old \u00b7 ' + holders + '</div>' +
      comp(t, true) +
    '</div>' +
    '<div class="lead-score">' +
      '<div class="lead-num" style="color:' + tone(t.score) + '">' + t.score + '</div>' +
      '<div class="lead-of">of 100</div>' +
    '</div>';
}

function renderBoard() {
  const el = document.getElementById("board");
  if (!data.length) {
    el.innerHTML = '<div class="empty"><strong>Nothing detected yet</strong>' +
      'The scanner is watching for new pairs. Start it with <code>npm run scan</code> if it isn\'t running.</div>';
    return;
  }

  const sorted = [...data].sort((a, b) => {
    const get = (t, k) => ["score", "symbol", "launchedAt"].indexOf(k) > -1
      ? t[k]
      : (t.scores && t.scores[k] ? t.scores[k].score : 0);
    const av = get(a, sortKey), bv = get(b, sortKey);
    return typeof av === "string" ? sortDir * av.localeCompare(bv) : sortDir * ((av || 0) - (bv || 0));
  });

  el.innerHTML =
    '<div class="head">' +
      '<button data-k="score">Score</button>' +
      '<button data-k="symbol">Token</button>' +
      '<span class="h-comp">Signal mix</span>' +
      '<button data-k="launchedAt" class="r">Age</button>' +
      '<span class="r h-flag">Flag</span>' +
    '</div>' +
    sorted.map(t => {
      const open = openRow === t.address;
      let html =
        '<div class="row" data-a="' + t.address + '" tabindex="0" role="button" aria-expanded="' + open + '">' +
          '<div class="score c-score" style="color:' + tone(t.score) + '">' + t.score + '</div>' +
          '<div class="c-token"><div class="sym">' + t.symbol + venueBadge(t) + '</div><div class="addr">' + short(t.address) + ' \u00b7 ' + age(t.launchedAt) + '</div></div>' +
          '<div class="c-comp">' + comp(t) + '</div>' +
          '<div class="age c-age">' + age(t.launchedAt) + '</div>' +
          '<div class="flag c-flag">' + flagOf(t) + '</div>' +
        '</div>';
      if (open) {
        html += '<div class="detail">' +
          (t.vetoed ? '<div style="background:#3A2320;border:1px solid #C46B5A;color:#E8A99B;padding:11px 14px;border-radius:9px;font-size:13px;margin-bottom:14px;">Vetoed \u2014 ' + (t.vetoReason || "") + '</div>' : '') +
          (t.capped ? '<div style="background:#33291A;border:1px solid #D2A24C;color:#E0C48C;padding:11px 14px;border-radius:9px;font-size:13px;margin-bottom:14px;">Score capped at 70 \u2014 sellability could not be verified. Unknown is not safe.</div>' : '') +
          chips(t) + '<div class="sigs">' +
          SIGNALS.map(s => {
            const v = t.scores ? t.scores[s.key] : null;
            return '<div class="sig">' +
              '<div class="sig-top"><span class="sig-name">' + s.label + '</span>' +
              '<span class="sig-val" style="color:' + s.color + '">' + (v ? v.score : "\u2014") + '</span></div>' +
              '<div class="sig-why">' + (v && v.detail ? v.detail : "no data") + '</div>' +
            '</div>';
          }).join("") +
        '</div><div class="links">' +
          '<a href="' + EXPLORER + t.address + '" target="_blank" rel="noopener">Token on Blockscout</a>' +
          '<a href="https://robinhoodchain.blockscout.com/address/' + t.deployer + '" target="_blank" rel="noopener">Deployer wallet</a>' +
          '<a href="https://robinhoodchain.blockscout.com/address/' + t.pair + '" target="_blank" rel="noopener">Pair contract</a>' +
        '</div></div>';
      }
      return html;
    }).join("");

  el.querySelectorAll(".head button").forEach(b => {
    b.onclick = () => {
      const k = b.dataset.k;
      sortDir = sortKey === k ? -sortDir : -1;
      sortKey = k;
      renderBoard();
    };
  });
  el.querySelectorAll(".row").forEach(r => {
    const toggle = () => {
      openRow = openRow === r.dataset.a ? null : r.dataset.a;
      renderBoard();
    };
    r.onclick = toggle;
    r.onkeydown = e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
    };
  });
}

async function refresh() {
  const dot = document.getElementById("dot"), txt = document.getElementById("pulse-txt");
  try {
    const res = await fetch("/api/tokens");
    data = await res.json();
    dot.classList.remove("stale");
    txt.textContent = data.length ? data.length + " tracked" : "watching";
  } catch (e) {
    dot.classList.add("stale");
    txt.textContent = "scanner offline";
  }
  renderLead();
  renderBoard();
}

refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
